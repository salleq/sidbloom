name: Release
# Manual only. Releases are made by hand: run "Desktop build", try the installers, attach them to a draft
# release (SHA256SUMS included) and publish it. Publishing a release therefore does NOT start a build.
# Running this workflow builds every installer again and uploads them to the draft release for the tag you enter.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release / tag to attach the installers to (for example v0.1.0)"
        required: true

jobs:
  build:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,       os: ubuntu-22.04,     args: "" }
          - { name: linux-arm64,     os: ubuntu-22.04-arm, args: "" }
          - { name: windows-x64,     os: windows-latest,   args: "" }
          - { name: windows-arm64,   os: windows-11-arm,   args: "--bundles nsis" }
          - { name: macos-universal, os: macos-latest,     args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.os == 'macos-latest' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> target"
          key: ${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node app/node_modules/@tauri-apps/cli/tauri.js
          tagName: ${{ inputs.tag }}
          releaseName: "SIDbloom ${{ inputs.tag }}"
          releaseBody: "Unsigned preview build. See the README for installation notes (macOS: right-click > Open; Windows: SmartScreen > More info > Run anyway; Linux AppImage: chmod +x)."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS.txt for every file of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          rm -f SHA256SUMS.txt
          sha256sum -- * | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

