name: Release
# Merging a pull request to main updates the "release PR" (version bump + changelog, by release-please).
# Merging the release PR creates the tag and the GitHub release, and this workflow then builds every installer
# and attaches them (SHA256SUMS included) to that release. Commit titles decide the bump: "fix:" -> patch,
# "feat:" -> minor, "feat!:" or a "BREAKING CHANGE:" footer -> major (minor while the version is below 1.0).
# Run by hand ("Run workflow" with a tag) to rebuild and re-attach the installers of an existing release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release / tag to attach the installers to (for example v0.4.0)"
        required: true

jobs:
  release-please:
    name: release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: release (${{ matrix.name }})
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,       os: ubuntu-22.04,     args: "" }
          - { name: linux-arm64,     os: ubuntu-22.04-arm, args: "" }
          - { name: windows-x64,     os: windows-latest,   args: "" }
          - { name: windows-arm64,   os: windows-11-arm,   args: "--bundles nsis" }
          - { name: macos-universal, os: macos-latest,     args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.os == 'macos-latest' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> target"
          key: ${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node app/node_modules/@tauri-apps/cli/tauri.js
          tagName: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          releaseDraft: false
          args: ${{ matrix.args }}

  checksums:
    name: checksums
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS.txt for every file of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          rm -f SHA256SUMS.txt
          sha256sum -- * | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

