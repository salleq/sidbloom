name: Desktop build
# Builds the installers for every platform without publishing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,       os: ubuntu-22.04,     args: "",                                 bin: src-tauri/target/release/sidbloom-desktop,                          arch: "x86-64" }
          - { name: linux-arm64,     os: ubuntu-22.04-arm, args: "",                                 bin: src-tauri/target/release/sidbloom-desktop,                          arch: "aarch64" }
          - { name: windows-x64,     os: windows-latest,   args: "",                                 bin: src-tauri/target/release/sidbloom-desktop.exe,                      arch: "x86-64" }
          - { name: windows-arm64,   os: windows-11-arm,   args: "--bundles nsis",                   bin: src-tauri/target/release/sidbloom-desktop.exe,                      arch: "Aarch64" }
          - { name: macos-universal, os: macos-latest,     args: "--target universal-apple-darwin", bin: src-tauri/target/universal-apple-darwin/release/sidbloom-desktop,   arch: "arm64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.os == 'macos-latest' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> target"
          key: ${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev xvfb file
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
        working-directory: app
      - name: Desktop shell unit tests (MIDI parsing)
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        run: node app/node_modules/@tauri-apps/cli/tauri.js build ${{ matrix.args }}
      - name: Check the CPU architecture of the built app
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-*) file "${{ matrix.bin }}"; lipo -archs "${{ matrix.bin }}" | tee /dev/stderr | grep -q arm64 && lipo -archs "${{ matrix.bin }}" | grep -q x86_64 ;;
            windows-*) python -c "import struct,sys; d=open(r'${{ matrix.bin }}','rb').read(); pe=struct.unpack_from('<I',d,0x3c)[0]; m=struct.unpack_from('<H',d,pe+4)[0]; print(hex(m)); sys.exit(0 if m==({'x86-64':0x8664,'Aarch64':0xaa64}['${{ matrix.arch }}']) else 1)" ;;
            *) file "${{ matrix.bin }}" | tee /dev/stderr | grep -qi "${{ matrix.arch }}" ;;
          esac
      - name: Smoke test the built app (must keep running 12 s)
        shell: bash
        run: |
          cat > smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          "$1" > smoke.log 2>&1 &
          pid=$!
          sleep 12
          if kill -0 $pid 2>/dev/null; then echo "app still running after 12 s"; kill $pid; exit 0; fi
          wait $pid; echo "app exited early with code $?"; cat smoke.log; exit 1
          SCRIPT
          sed -i 's/^          //' smoke.sh
          chmod +x smoke.sh
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            # no GPU or session bus on the runner: use WebKit's software paths
            export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1
            xvfb-run -a --server-args="-screen 0 1280x800x24" ./smoke.sh "${{ matrix.bin }}"
          else
            ./smoke.sh "${{ matrix.bin }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sidbloom-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
