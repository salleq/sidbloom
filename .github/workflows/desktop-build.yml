name: Desktop build
# Builds the installers on every platform without publishing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.os == 'macos-latest' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
        working-directory: app
      - name: Desktop shell unit tests (MIDI parsing)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        run: node app/node_modules/@tauri-apps/cli/tauri.js build ${{ matrix.args }}
      - name: Smoke test the built app (must keep running 12 s)
        if: matrix.os != 'ubuntu-22.04'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            exe=$(ls src-tauri/target/release/sidbloom-desktop.exe)
          else
            exe=$(ls src-tauri/target/universal-apple-darwin/release/sidbloom-desktop)
          fi
          "$exe" &
          pid=$!
          sleep 12
          if kill -0 $pid 2>/dev/null; then echo "app still running after 12 s"; kill $pid; else echo "app exited early"; wait $pid; echo "exit code $?"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sidbloom-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
