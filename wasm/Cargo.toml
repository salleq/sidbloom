[package]
name = "sidbloom-wasm"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebAssembly bindings of sidcore for the SIDbloom UI"

[lib]
crate-type = ["cdylib"]

[dependencies]
sidcore = { path = "../core" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
serde_json = "1"
