[package]
name = "sidcore"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Core of a modern 3-channel SID tracker: model, engine, export"

[dependencies]
miniz_oxide = "0.9.1"
resid = { package = "resid-rs", version = "1.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mos6502 = "0.10.1"
